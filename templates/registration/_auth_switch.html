{% comment %}
  The Create account / Sign in switch at the top of both auth cards. `mode` is "login" or
  "signup". A ?next= destination rides along, so switching pages never loses it.
{% endcomment %}
<nav class="segmented mb-3" aria-label="Account">
  <a href="{% url 'signup' %}{% if next %}?next={{ next|urlencode }}{% endif %}"{% if mode == 'signup' %} class="is-on" aria-current="page"{% endif %}>Create account</a>
  <a href="{% url 'login' %}{% if next %}?next={{ next|urlencode }}{% endif %}"{% if mode == 'login' %} class="is-on" aria-current="page"{% endif %}>Sign in</a>
</nav>
